[project]
name = "penguin-lab"
version = "0.1.0"
description = "Reproducible Palmer penguins exploration and body-mass regression"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit>=1.45,<2", "pandas>=2.2,<3", "altair>=5,<6", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
